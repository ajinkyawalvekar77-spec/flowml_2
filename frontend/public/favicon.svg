<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="FlowML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C084FC"/><stop offset="0.5" stop-color="#7C3AED"/><stop offset="1" stop-color="#4C1D95"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.25" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#EDE9FE"/><stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .flow{stroke-dasharray:6 10;animation:dash 1.6s linear infinite}
    .n{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    .n2{animation-delay:.4s}.n3{animation-delay:.8s}
    @keyframes dash{to{stroke-dashoffset:-32}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}
    @media (prefers-reduced-motion:reduce){.flow,.n{animation:none}}
  </style>
  <g>
    <rect width="64" height="64" rx="18" fill="url(#bg)"/>
    <rect width="64" height="64" rx="18" fill="url(#shine)"/>
    <rect x=".5" y=".5" width="63" height="63" rx="17.5" fill="none" stroke="#fff" stroke-opacity=".25"/>
    <path d="M15 44 C27 44 25 32 32 32 C39 32 37 20 49 20" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" opacity=".9"/>
    <path class="flow" d="M15 44 C27 44 25 32 32 32 C39 32 37 20 49 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <g filter="url(#glow)">
      <circle class="n" cx="15" cy="44" r="6" fill="#fff"/>
      <circle class="n n2" cx="32" cy="32" r="6" fill="#fff"/>
      <circle class="n n3" cx="49" cy="20" r="6.5" fill="#fff"/>
    </g>
    <circle cx="15" cy="44" r="2.4" fill="#7C3AED"/>
    <circle cx="32" cy="32" r="2.4" fill="#7C3AED"/>
    <circle cx="49" cy="20" r="2.8" fill="#C084FC"/>
  </g>
</svg>
